<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fiva — Five Vertex Tours Voice Assistant</title>
<style>
  :root {
    --teal-950: #063833; --teal-900: #0A4D48; --teal-700: #0F6F6A;
    --teal-500: #12827A; --teal-300: #3AB3AB; --teal-100: #C2EAE8; --teal-50: #E8F7F6;
    --yellow: #FDE047;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 28px; padding: 24px;
    background: radial-gradient(1200px 800px at 50% -10%, var(--teal-900), var(--teal-950));
    color: #fff;
  }
  .brand { text-align: center; }
  .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
  .brand p { margin-top: 6px; font-size: 13px; color: var(--teal-100); }

  /* Voice orb */
  .orb-wrap { position: relative; width: 190px; height: 190px; display: grid; place-items: center; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(58,179,171,0.35); transition: transform 0.12s ease-out, opacity 0.3s; }
  .ring.r2 { inset: -16px; border-color: rgba(58,179,171,0.18); }
  .orb {
    width: 150px; height: 150px; border-radius: 50%;
    background: linear-gradient(145deg, var(--teal-300), var(--teal-500) 55%, var(--teal-700));
    box-shadow: 0 0 60px rgba(18,130,122,0.55), inset 0 -12px 30px rgba(6,56,51,0.45);
    display: grid; place-items: center; transition: transform 0.12s ease-out;
  }
  .orb svg { width: 54px; height: 54px; fill: #fff; opacity: 0.95; }
  .orb.listening { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { box-shadow: 0 0 45px rgba(18,130,122,0.45), inset 0 -12px 30px rgba(6,56,51,0.45);} 50% { box-shadow: 0 0 85px rgba(58,179,171,0.75), inset 0 -12px 30px rgba(6,56,51,0.45);} }

  .status { font-size: 14px; color: var(--teal-100); min-height: 20px; text-align: center; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f87171; margin-right: 8px; vertical-align: 1px; }
  .status.on .dot { background: #4ade80; }

  .chat {
    max-width: 520px; width: 100%; max-height: 240px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px; padding: 12px 14px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; backdrop-filter: blur(6px); scroll-behavior: smooth;
  }
  .chat:empty::after { content: "Press Start and speak to Fiva…"; color: rgba(255,255,255,0.4); font-size: 13px; text-align: center; }
  .msg { max-width: 85%; padding: 8px 13px; border-radius: 14px; font-size: 13px; line-height: 1.5; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--teal-500); color: #fff; border-bottom-right-radius: 4px; }
  .msg.user.interim { opacity: 0.6; }
  .msg.bot { align-self: flex-start; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.92); border-bottom-left-radius: 4px; }

  .typebar { display: none; max-width: 520px; width: 100%; gap: 8px; }
  .typebar input {
    flex: 1; padding: 11px 16px; border-radius: 999px; font-size: 14px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; outline: none;
  }
  .typebar input::placeholder { color: rgba(255,255,255,0.4); }
  .typebar input:focus { border-color: var(--teal-300); }
  .typebar button { padding: 11px 20px; background: var(--teal-500); border: 1px solid rgba(255,255,255,0.3); }

  .controls { display: flex; gap: 14px; }
  button {
    border: none; cursor: pointer; font-size: 15px; font-weight: 600;
    padding: 14px 30px; border-radius: 999px; transition: all 0.25s;
    display: flex; align-items: center; gap: 9px; color: #fff;
  }
  #startBtn { background: linear-gradient(90deg, var(--teal-700), var(--teal-500), var(--teal-300)); box-shadow: 0 6px 28px rgba(18,130,122,0.5); border: 1px solid rgba(255,255,255,0.35); }
  #startBtn:hover { transform: scale(1.04); box-shadow: 0 6px 38px rgba(58,179,171,0.7); }
  #endBtn { background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.5); color: #fca5a5; display: none; }
  #endBtn:hover { background: rgba(248,113,113,0.3); }
  #muteBtn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); display: none; }
  #muteBtn.muted { background: var(--yellow); color: var(--teal-950); }
  button:disabled { opacity: 0.5; cursor: wait; transform: none !important; }

  .foot { font-size: 11px; color: rgba(255,255,255,0.35); text-align: center; }
  .foot a { color: var(--teal-300); text-decoration: none; }
</style>
</head>
<body>
  <div class="brand">
    <h1>✦ Talk to Fiva</h1>
    <p>Five Vertex Tours — AI voice assistant. Ask about activities, prices &amp; bookings.</p>
  </div>

  <div class="orb-wrap">
    <div class="ring" id="ring1"></div>
    <div class="ring r2" id="ring2"></div>
    <div class="orb" id="orb">
      <svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4Zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.94V22h2v-3.06A8 8 0 0 0 20 11h-2Z"/></svg>
    </div>
  </div>

  <div class="status" id="status"><span class="dot"></span>Not connected</div>
  <div class="chat" id="chat"></div>
  <div class="typebar" id="typebar">
    <input type="text" id="typeInput" placeholder="Type email or phone here if easier…" autocomplete="off" />
    <button id="typeSend">Send</button>
  </div>

  <div class="controls">
    <button id="startBtn">▶ &nbsp;Start call</button>
    <button id="muteBtn">🎙 Mute</button>
    <button id="endBtn">✕ &nbsp;End call</button>
  </div>

  <p class="foot">Powered by Five Vertex Tours · <a href="https://five.tours">five.tours</a></p>

  <audio id="botAudio" autoplay playsinline></audio>

<script>
(function () {
  const API_OFFER = "/api/offer"; // same origin — nginx proxies to the bot

  const startBtn = document.getElementById("startBtn");
  const endBtn = document.getElementById("endBtn");
  const muteBtn = document.getElementById("muteBtn");
  const statusEl = document.getElementById("status");
  const orb = document.getElementById("orb");
  const ring1 = document.getElementById("ring1");
  const ring2 = document.getElementById("ring2");
  const chatEl = document.getElementById("chat");
  const typebar = document.getElementById("typebar");
  const typeInput = document.getElementById("typeInput");
  const typeSend = document.getElementById("typeSend");
  const botAudio = document.getElementById("botAudio");

  // --- chat log helpers ---------------------------------------------------
  let interimUserEl = null;   // live (not yet final) user speech bubble
  let currentBotEl = null;    // bot bubble being extended this turn

  function addMsg(role, text, interim) {
    const el = document.createElement("div");
    el.className = "msg " + role + (interim ? " interim" : "");
    el.textContent = text;
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
    return el;
  }

  function onUserText(text, final) {
    currentBotEl = null; // user turn started → next bot text is a new bubble
    if (!interimUserEl) interimUserEl = addMsg("user", text, true);
    else interimUserEl.textContent = text;
    if (final) {
      interimUserEl.classList.remove("interim");
      interimUserEl = null;
    }
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function onBotText(text) {
    if (!currentBotEl) currentBotEl = addMsg("bot", text, false);
    else currentBotEl.textContent += " " + text;
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  let pc = null, micStream = null, audioCtx = null, rafId = null, muted = false;
  let dc = null, pingTimer = null, botSpeaking = false;
  let botAnalyser = null, micAnalyser = null;

  function setStatus(text, connected) {
    statusEl.innerHTML = '<span class="dot"></span>' + text;
    statusEl.classList.toggle("on", !!connected);
  }

  function waitIceComplete(pc) {
    return new Promise((resolve) => {
      if (pc.iceGatheringState === "complete") return resolve();
      const check = () => {
        if (pc.iceGatheringState === "complete") {
          pc.removeEventListener("icegatheringstatechange", check);
          resolve();
        }
      };
      pc.addEventListener("icegatheringstatechange", check);
      setTimeout(resolve, 3000); // fallback: don't wait forever
    });
  }

  function makeAnalyser(stream) {
    const src = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    return analyser;
  }

  function levelOf(analyser, buf) {
    analyser.getByteFrequencyData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i];
    return sum / buf.length / 255; // 0..1
  }

  // Animate: orb follows the bot's voice, rings follow YOUR voice
  function startVisualizer() {
    const botBuf = new Uint8Array(128);
    const micBuf = new Uint8Array(128);
    const loop = () => {
      const bot = botAnalyser ? levelOf(botAnalyser, botBuf) : 0;
      const mic = micAnalyser && !muted ? levelOf(micAnalyser, micBuf) : 0;
      orb.style.transform = `scale(${1 + bot * 0.3})`;
      ring1.style.transform = `scale(${1 + mic * 0.5})`;
      ring2.style.transform = `scale(${1 + mic * 0.8})`;
      rafId = requestAnimationFrame(loop);
    };
    loop();
  }

  // RTVI data channel — WE create it (before createOffer, so it's in the SDP).
  // Carries live transcripts + bot speaking events; pings keep the server happy.
  function setupRtviChannel() {
    dc = pc.createDataChannel("rtvi-ai", { ordered: true });
    dc.onopen = () => {
      dc.send(JSON.stringify({
        id: "web-" + Date.now(),
        label: "rtvi-ai",
        type: "client-ready",
        data: {},
      }));
      pingTimer = setInterval(() => {
        if (dc && dc.readyState === "open") dc.send("ping-" + Date.now());
      }, 1000);
    };
    dc.onmessage = (msg) => {
      let d;
      try { d = JSON.parse(msg.data); } catch (_) { return; }
      const data = d.data || {};
      switch (d.type) {
        case "user-transcription":
          if (data.text) onUserText(data.text, !!data.final);
          break;
        case "bot-transcription": // sentence-level; ignore word-level bot-tts-text
          if (data.text) onBotText(data.text);
          break;
        case "bot-started-speaking":
          botSpeaking = true;
          setStatus("Fiva is speaking…", true);
          break;
        case "bot-stopped-speaking":
          botSpeaking = false;
          currentBotEl = null;
          setStatus("Connected — Fiva is listening", true);
          break;
      }
    };
  }

  // Typed input (email/phone are easier to type than to spell out loud)
  function sendTyped() {
    const text = typeInput.value.trim();
    if (!text || !dc || dc.readyState !== "open") return;
    dc.send(JSON.stringify({
      id: "t-" + Date.now(),
      label: "rtvi-ai",
      type: "send-text",
      data: { content: text, options: { run_immediately: true, audio_response: true } },
    }));
    addMsg("user", text, false);
    currentBotEl = null;
    typeInput.value = "";
  }
  typeSend.addEventListener("click", sendTyped);
  typeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendTyped(); });

  async function startCall() {
    startBtn.disabled = true;
    setStatus("Requesting microphone…");
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
    } catch (e) {
      setStatus("Microphone blocked — allow access and retry");
      startBtn.disabled = false;
      return;
    }

    // Create the AudioContext HERE, inside the click gesture — otherwise the
    // browser leaves it suspended and the orb never moves.
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    micAnalyser = makeAnalyser(micStream);

    setStatus("Connecting to Fiva…");
    pc = new RTCPeerConnection({
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        // TURN relay — required because signaling runs through Cloudflare Tunnel
        // (audio can't pass the tunnel). Must match your coturn user/secret.
        {
          urls: "turn:turn.five.tours:3478",
          username: "fiva",
          credential: "Teacher@@62@89",
        },
      ],
    });
    micStream.getTracks().forEach((t) => pc.addTrack(t, micStream));
    pc.addTransceiver("audio", { direction: "sendrecv" });

    pc.ontrack = (ev) => {
      botAudio.srcObject = ev.streams[0];
      botAnalyser = makeAnalyser(ev.streams[0]);
    };
    setupRtviChannel();
    startVisualizer();

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "connected") {
        setStatus("Connected — Fiva is listening", true);
        orb.classList.add("listening");
        startBtn.style.display = "none";
        endBtn.style.display = "flex";
        muteBtn.style.display = "flex";
        typebar.style.display = "flex";
      } else if (["failed", "disconnected", "closed"].includes(pc.connectionState)) {
        endCall();
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitIceComplete(pc);

    try {
      const resp = await fetch(API_OFFER, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const answer = await resp.json();
      await pc.setRemoteDescription(answer);
    } catch (e) {
      setStatus("Could not reach the assistant — try again shortly");
      cleanup();
      startBtn.disabled = false;
    }
  }

  function cleanup() {
    if (rafId) cancelAnimationFrame(rafId);
    if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
    if (dc) { try { dc.close(); } catch (_) {} dc = null; }
    botAnalyser = null; micAnalyser = null; botSpeaking = false;
    if (audioCtx) { try { audioCtx.close(); } catch (_) {} audioCtx = null; }
    if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
    if (pc) { try { pc.close(); } catch (_) {} pc = null; }
    orb.classList.remove("listening");
    orb.style.transform = ""; ring1.style.transform = ""; ring2.style.transform = "";
  }

  function endCall() {
    cleanup();
    setStatus("Call ended");
    interimUserEl = null; currentBotEl = null;
    startBtn.disabled = false;
    startBtn.style.display = "flex";
    endBtn.style.display = "none";
    muteBtn.style.display = "none";
    typebar.style.display = "none";
    muteBtn.classList.remove("muted"); muted = false; muteBtn.textContent = "🎙 Mute";
  }

  function toggleMute() {
    if (!micStream) return;
    muted = !muted;
    micStream.getAudioTracks().forEach((t) => (t.enabled = !muted));
    muteBtn.classList.toggle("muted", muted);
    muteBtn.textContent = muted ? "🔇 Unmute" : "🎙 Mute";
  }

  startBtn.addEventListener("click", startCall);
  endBtn.addEventListener("click", endCall);
  muteBtn.addEventListener("click", toggleMute);
})();
</script>
</body>
</html>
