services:
  fiva-bot:
    build: .
    container_name: fiva-bot
    env_file: .env
    # host networking: WebRTC media uses dynamic UDP ports — mapping them
    # individually is impractical. Host mode gives aiortc direct access.
    network_mode: host
    volumes:
      - ./data:/app/data:ro    # agents.json (Fiva's prompt + greeting) — in this repo
    restart: unless-stopped

  voice-web:
    image: nginx:alpine
    container_name: fiva-web
    network_mode: host          # serves 80 + 443 directly (see nginx.conf)
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - fiva-bot
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    container_name: fiva-turn
    network_mode: host
    # VPS has its public IP directly on the interface — no NAT, so no
    # --external-ip mapping needed. Password must match web/index.html.
    command: >
      --listening-port=3478
      --min-port=49160 --max-port=49200
      --realm=turn.five.tours
      --user=fiva:36d0680a0cb366f736c7341389092658a9e64611d0a25acd
      --lt-cred-mech
      --fingerprint
      --no-cli
      --no-tls --no-dtls
    restart: unless-stopped
