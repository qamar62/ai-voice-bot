server {
    # Cloudflare tunnel points voice.five.tours at this port
    listen 8090;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }
}
