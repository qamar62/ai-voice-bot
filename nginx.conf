# VPS deployment — nginx terminates SSL itself (no Cloudflare in front).
server {
    listen 80;
    server_name voice.five.tours;

    # Let's Encrypt renewal challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name voice.five.tours;

    ssl_certificate     /etc/letsencrypt/live/voice.five.tours/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.five.tours/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }

    # Pipecat's built-in test client — for debugging (compare against our UI)
    location /client {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
    }
}
